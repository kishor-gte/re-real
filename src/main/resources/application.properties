spring.application.name=RealEstate
server.port=8081
server.forward-headers-strategy=framework

spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

app.database.name=realestate
app.database.host=localhost
app.database.port=3306

spring.datasource.url=jdbc:mysql://${app.database.host}:${app.database.port}/${app.database.name}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.tool.schema.halt_on_error=false
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

app.name=EstateVault
app.support-email=support@estatevault.com
app.agent.referral-commission=500
app.upload.dir=uploads/profiles
app.otp.expiry-minutes=5
app.otp.resend-seconds=30
app.otp.max-attempts=5

# --- OTP email (Gmail App Password — NOT your Gmail login password) ---
# Create at: Google Account > Security > 2-Step Verification > App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kvsudeep014@gmail.com
spring.mail.password=mtqtgfdqjmzeufjm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# OTP email: smtp = send to inbox only (no on-screen OTP)
app.mail.otp-max-wait-ms=30000
app.mail.smtp.connection-timeout-ms=15000
app.mail.smtp.read-timeout-ms=30000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.delivery=smtp
app.mail.fallback-console=false
app.mail.expose-otp-in-response=false

# JWT (change secret in production)
app.jwt.secret=EstateVaultJwtSecretKeyChangeThisInProduction2026Min32Chars!!
app.jwt.expiration-seconds=86400
app.jwt.remember-me-expiration-seconds=2592000
app.jwt.cookie-name=ESTATEVAULT_TOKEN

# Optional: override reset-link host in emails (production). Example: https://estatevault.com
# Leave empty to use the browser URL dynamically (works on localhost and deployed sites).
app.public-base-url=
app.password-reset.expiry-minutes=30
app.mail.expose-reset-token-in-response=true

app.upload.admin-dir=uploads/admin-profiles
app.admin.session-timeout-minutes=120
app.admin.max-login-attempts=5

app.upload.agent-dir=uploads/agent
app.upload.agent-document-max-mb=20
app.upload.property-dir=uploads/properties
app.upload.property-image-max-mb=10
app.agent.session-timeout-minutes=120
app.agent.max-login-attempts=5

app.upload.pg-owner-dir=uploads/pg-owner
app.pg-owner.session-timeout-minutes=120
app.pg-owner.max-login-attempts=5

