spring.application.name=RealEstate
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

# Database config: read sensitive values from environment variables in production
app.database.name=${APP_DATABASE_NAME:realestate}
app.database.host=${APP_DATABASE_HOST:localhost}
app.database.port=${APP_DATABASE_PORT:3306}

spring.datasource.url=jdbc:mysql://${app.database.host}:${app.database.port}/${app.database.name}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM2DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.tool.schema.halt_on_error=false
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

app.name=EstateVault
app.support-email=support@estatevault.com
app.agent.referral-commission=500
app.upload.dir=${APP_UPLOAD_DIR:uploads/profiles}
app.otp.expiry-minutes=5
app.otp.resend-seconds=30
app.otp.max-attempts=5

# Email (do NOT store real credentials in repo). Set via env vars or secret manager.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:root}
spring.mail.password=${SPRING_MAIL_PASSWORD:root}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.delivery=smtp
app.mail.fallback-console=false
app.mail.expose-otp-in-response=false

# JWT secret must come from an environment variable or secret manager in production
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-seconds=86400
app.jwt.remember-me-expiration-seconds=2592000
app.jwt.cookie-name=ESTATEVAULT_TOKEN

# Optional: override reset-link host in emails (production). Example: https://estatevault.com
app.public-base-url=
app.password-reset.expiry-minutes=30
app.mail.expose-reset-token-in-response=false

app.upload.admin-dir=${APP_UPLOAD_ADMIN_DIR:uploads/admin-profiles}
app.admin.session-timeout-minutes=120
app.admin.max-login-attempts=5

app.upload.agent-dir=${APP_UPLOAD_AGENT_DIR:uploads/agent}
app.upload.agent-document-max-mb=20
app.upload.property-dir=${APP_UPLOAD_PROPERTY_DIR:uploads/properties}
app.upload.property-image-max-mb=10
app.agent.session-timeout-minutes=120
app.agent.max-login-attempts=5

app.upload.pg-owner-dir=${APP_UPLOAD_PG_OWNER_DIR:uploads/pg-owner}
app.pg-owner.session-timeout-minutes=120
app.pg-owner.max-login-attempts=5

# Razorpay keys should be provided via env vars (do not commit secrets)
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.currency=INR

# Property booking & payment
app.booking.gst-percent=3.33
app.booking.registration-percent=1.11
app.booking.booking-charges-flat=25000
app.booking.advance-percent=10
app.booking.emi-down-payment-percent=10.58
app.booking.emi-annual-interest=12
app.booking.reservation-minutes=30
app.booking.invoice-dir=${APP_BOOKING_INVOICE_DIR:uploads/invoices}
app.booking.enabled=true

logging.level.root=INFO
logging.level.com.realestate.main=DEBUG
logging.level.org.hibernate.tool.schema=ERROR

# Static assets: classpath:/static/ and src/main/webapp/css|js (see WebMvcConfig)
spring.web.resources.static-locations=classpath:/static/,classpath:/META-INF/resources/

# Real-time chat & voice (WebRTC STUN)
app.rtc.stun.urls=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
app.upload.rtc-dir=${APP_UPLOAD_RTC_DIR:uploads/rtc}

# Actuator / monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.export.prometheus.enabled=true

# Flyway (DB migrations). Place SQL files under src/main/resources/db/migration
spring.flyway.enabled=false

